# ========== APPLICATION ==========
spring.application.name=new-agregateur-prod
server.port=8087

# ========== BASE DE DONNÉES MYSQL ==========
spring.datasource.url=jdbc:mysql://localhost:3306/banque-prod?useUnicode=true&characterEncoding=utf8

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ? Dialect explicite pour MySQL 8+ (plus précis)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ? Paramètres d'encodage (UTF-8 complet)
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.collation=utf8mb4_general_ci

# ? Optionnelle : force Hibernate à utiliser le nom exact des tables/champs
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ========== LOGGING ==========
logging.level.org.springframework.security=INFO
logging.level.com.dimsoft.agregateur=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ========== FICHIERS ==========
file.upload.directory=src/main/resources/data/fichiers

# Taille maximale des fichiers
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Active la requête SQL et ses paramètres réels
logging.level.org.hibernate.orm.jdbc.bind=TRACE
