# ========== APPLICATION ==========
spring.application.name=new-agregateur-prod
server.port=8087

# ========== BASE DE DONNÉES MYSQL ==========
spring.datasource.url=jdbc:mysql://localhost:3306/banque_prod?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ========== LOGGING ==========
logging.level.org.springframework.security=INFO
logging.level.com.dimsoft.agregateur=DEBUG

# ========== FICHIERS ==========
file.upload.directory=src/main/resources/data/fichiers

# Taille maximale des fichiers
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true